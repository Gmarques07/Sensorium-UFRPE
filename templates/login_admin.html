<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Admin - Sensorium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #003366;
            --accent-color: #00E676;
            --light-bg: #f5f9ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            padding-top: 5rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            background-color: var(--light-bg);
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(0, 230, 118, 0.15);
            background-color: #fff;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 2px solid #e9ecef;
            border-right: none;
            background-color: var(--light-bg);
            color: var(--primary-color);
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }

        .btn-primary,
        .btn-primary:active,
        .btn-primary:focus,
        .btn-primary:disabled {
            background-color: var(--accent-color) !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 0.75rem 1.5rem !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.5rem !important;
            color: #000 !important;
        }

        .btn-primary:hover {
            background-color: #00c4ad !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 15px rgba(0, 224, 198, 0.3) !important;
            color: #000 !important;
        }

        .link-secondary {
            color: var(--secondary-color);
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .link-secondary:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .alert {
            border-radius: 10px;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .icon-shield {
            color: var(--primary-color);
            font-size: 3rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .icon-shield:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        /* Modo Dark */
        body.dark-mode {
            background: #101010;
        }

        body.dark-mode .login-card {
            background: #181818;
            border: 1px solid #232323;
        }

        body.dark-mode .form-control {
            background: rgba(18,18,18,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.9);
        }

        body.dark-mode .input-group-text {
            background: rgba(18,18,18,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--accent-color);
        }

        body.dark-mode .form-label {
            color: rgba(255,255,255,0.9);
        }

        body.dark-mode .text-primary {
            color: var(--accent-color) !important;
        }

        body.dark-mode .text-muted {
            color: rgba(255,255,255,0.6) !important;
        }

        body.dark-mode .link-secondary {
            color: rgba(255,255,255,0.85);
        }

        body.dark-mode .link-secondary:hover {
            color: var(--accent-color);
        }

        body.dark-mode .icon-shield {
            color: var(--accent-color);
        }

        body.dark-mode .form-control::placeholder {
            color: rgba(255,255,255,0.55) !important;
        }
    </style>
</head>
<body>
    {% include 'partials/navbar.html' %}
    
    <div class="login-card" data-aos="fade-up">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <i class="bi bi-shield-lock icon-shield"></i>
                <h2 class="mt-3 text-primary">Acesso Administrativo</h2>
                <p class="text-muted">Área restrita para administração</p>
            </a>
        </div>

        <div class="mb-4">
            <a href="index.html" class="link-secondary">
                <i class="bi bi-arrow-left"></i>
                <span>Voltar à Página Inicial</span>
            </a>
        </div>
        
        <div id="alert-container"></div>

        <form id="adminLoginForm" data-aos="fade-up" data-aos-delay="200">
            <div class="mb-4">
                <label for="usuario-admin" class="form-label">
                    <i class="bi bi-person-badge me-2"></i>Usuário
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="usuario-admin" name="username" class="form-control" 
                           placeholder="Usuário admin" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <label for="senha-admin" class="form-label">
                    <i class="bi bi-key me-2"></i>Senha
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="senha-admin" name="password" class="form-control" 
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" id="login-button">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Entrar</span>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const button = document.getElementById('login-button');
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';
            button.disabled = true;
            button.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Entrando...`;

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('usuario-admin').value);
            formData.append('password', document.getElementById('senha-admin').value);

            try {
                const response = await fetch('/api/v1/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('adminAccessToken', result.access_token);
                    window.location.href = '/admin_dashboard.html';
                } else {
                    throw new Error(result.detail || 'Usuário ou senha inválidos.');
                }

            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Erro!</strong> ${error.message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.innerHTML = `<i class="bi bi-box-arrow-in-right"></i><span>Entrar</span>`;
            }
        });

        // Tema escuro
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const sunIcon = document.querySelector('.bi-sun-fill');
            const moonIcon = document.querySelector('.bi-moon-fill');
            
            // Verificar tema salvo
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                sunIcon.classList.remove('d-none');
                moonIcon.classList.add('d-none');
            }

            // Alternar tema
            themeToggle.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.toggle('dark-mode');
                sunIcon.classList.toggle('d-none');
                moonIcon.classList.toggle('d-none');
                
                // Salvar preferência
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
