<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Sensorium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="signup-card" data-aos="fade-up">
        <div class="text-center mb-4">
            <a href="{{ url_for('homepage') }}" class="text-decoration-none">
                <i class="bi bi-cpu logo-icon"></i>
                <h2 class="mt-3 mb-2">Criar Conta no Sensorium</h2>
                <p class="text-muted mb-0">Preencha seus dados para começar</p>
            </a>
        </div>

        <div class="mb-4">
            <a href="{{ url_for('homepage') }}" class="link-secondary back-link">
                <i class="bi bi-arrow-left me-2"></i>Voltar à Página Inicial
            </a>
        </div>

        <div id="alert-container"></div>

        <form id="cadastroForm">
            <div class="mb-4">
                <label for="nome" class="form-label">Nome Completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="João da Silva" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="endereco" class="form-label">Endereço</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <input type="text" id="endereco" name="endereco" class="form-control" placeholder="Rua, Número - Bairro" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" minlength="8" required>
                    <button class="btn btn-outline-secondary btn-senha" type="button" tabindex="-1" onclick="togglePasswordVisibility()">
                        <i class="bi bi-eye" id="toggleSenhaIcon"></i>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <div class="mb-4">
                <label for="confirmacao_senha" class="form-label">Confirme sua Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" id="confirmacao_senha" name="confirmacao_senha" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary btn-senha" type="button" tabindex="-1" onclick="toggleConfirmPasswordVisibility()">
                        <i class="bi bi-eye" id="toggleConfirmSenhaIcon"></i>
                    </button>
                </div>
                <div class="text-danger small mt-1" id="passwordMatch"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3 btn-disabled" disabled id="btnCriarConta">
                <i class="bi bi-person-plus me-2"></i>Criar Conta
            </button>
            
            <div class="d-grid gap-2 mb-3">
                <a href="/api/v1/oauth/google/login" class="btn btn-danger" style="background-color: #DB4437; border-color: #DB4437;">
                    <i class="bi bi-google me-2"></i>Cadastrar com Google
                </a>
            </div>

            <div class="text-center">
                <p class="mb-0">
                    Já tem uma conta?
                    <a href="{{ url_for('login_usuario') }}" class="link-secondary ms-1">Faça login aqui</a>
                </p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({ duration: 800, once: true });

        document.addEventListener('DOMContentLoaded', function() {
            const senhaInput = document.getElementById('senha');
            const confirmSenhaInput = document.getElementById('confirmacao_senha');
            const passwordMatch = document.getElementById('passwordMatch');
            const strengthBar = document.getElementById('passwordStrength');
            const form = document.getElementById('cadastroForm');
            const camposObrigatorios = form.querySelectorAll('input[required], textarea[required], select[required]');
            const btnCriarConta = document.getElementById('btnCriarConta');

            function checkFormValidity() {
                let allRequiredFieldsFilled = true;
                let passwordsMatchResult = false;

                camposObrigatorios.forEach(campo => {
                    let isFieldFilled = true;
                    if (campo.type === 'checkbox') {
                        if (!campo.checked) isFieldFilled = false;
                    } else if (campo.value.trim() === '') {
                        isFieldFilled = false;
                    }
                    if (!isFieldFilled) allRequiredFieldsFilled = false;
                });

                const password = senhaInput.value;
                const confirmPassword = confirmSenhaInput.value;

                if (password && confirmPassword) passwordsMatchResult = password === confirmPassword;

                checkPassword();

                if (allRequiredFieldsFilled && passwordsMatchResult) {
                    btnCriarConta.disabled = false;
                    btnCriarConta.classList.remove('btn-disabled');
                } else {
                    btnCriarConta.disabled = true;
                    btnCriarConta.classList.add('btn-disabled');
                }
            }

            function checkPassword() {
                const password = senhaInput.value;
                const confirmPassword = confirmSenhaInput.value;

                if (password && confirmPassword) {
                    if (password === confirmPassword) {
                        passwordMatch.textContent = 'Senhas conferem';
                        passwordMatch.className = 'text-success small mt-1';
                    } else {
                        passwordMatch.textContent = 'Senhas não conferem';
                        passwordMatch.className = 'text-danger small mt-1';
                    }
                } else passwordMatch.textContent = '';
            }

            function checkPasswordStrength(password) {
                let strength = 0;
                if (password.length >= 8) strength++;
                if (password.match(/[a-z]+/)) strength++;
                if (password.match(/[A-Z]+/)) strength++;
                if (password.match(/[0-9]+/)) strength++;
                if (password.match(/[!@#$%^&*(),.?":{}|<>]+/)) strength++;

                const colors = ['#ff4444', '#ffbb33', '#00C851', '#33b5e5', '#2BBBAD'];
                strengthBar.style.width = ((strength / 5) * 100) + '%';
                strengthBar.style.backgroundColor = colors[strength - 1] || '';
                strengthBar.style.display = password ? 'block' : 'none';
            }

            senhaInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                checkPassword();
                checkFormValidity();
            });

            confirmSenhaInput.addEventListener('input', function() {
                checkPassword();
                checkFormValidity();
            });

            camposObrigatorios.forEach(campo => {
                campo.addEventListener('input', checkFormValidity);
                campo.addEventListener('change', checkFormValidity);
            });

            checkFormValidity();
        });

        function togglePasswordVisibility() {
            const senha = document.getElementById("senha");
            const icon = document.getElementById("toggleSenhaIcon");
            const tipo = senha.type === "password" ? "text" : "password";
            senha.type = tipo;
            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");
        }

        function toggleConfirmPasswordVisibility() {
            const confirmacao = document.getElementById("confirmacao_senha");
            const icon = document.getElementById("toggleConfirmSenhaIcon");
            const tipo = confirmacao.type === "password" ? "text" : "password";
            confirmacao.type = tipo;
            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");
        }

        document.getElementById('cadastroForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btnCriarConta');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Cadastrando...';

            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';

            const data = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                endereco: document.getElementById('endereco').value,
                senha: document.getElementById('senha').value
            };

            try {
                const response = await fetch('/api/v1/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                            <strong>Sucesso!</strong> Cadastro realizado. Você será redirecionado para o login.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>`;
                    localStorage.setItem('accessToken', result.access_token);
                    setTimeout(() => { window.location.href = 'login_usuario.html'; }, 3000);
                } else {
                    const errorMessage = result.detail || 'Ocorreu um erro ao tentar cadastrar.';
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                            <strong>Erro!</strong> ${errorMessage}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>`;
                }
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                        <strong>Erro de conexão!</strong> Não foi possível se conectar ao servidor.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Criar Conta';
            }
        });
    </script>
</body>
</html>
