<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Sensorium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #003366;
            --accent-color: #00E676;
            --light-bg: #f5f9ff;
            --dark-text: #2c3e50;
            --light-text: #ffffff;
            --border-radius: 15px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--dark-text);
        }

        .sidebar {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            min-height: 100vh;
            color: var(--light-text);
            padding: 2rem 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar .nav-link {
            color: var(--light-text);
            margin-bottom: 0.75rem;
            font-weight: 500;
            border-radius: var(--border-radius);
            padding: 0.75rem 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .nav-link i {
            font-size: 1.25rem;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .content {
            margin-left: 280px;
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard-card {
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #fff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
            border: none;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .table-responsive {
            min-height: 200px;
        }

        .placeholder-glow .placeholder {
            border-radius: 12px;
        }

        @media (max-width: 767px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }
            .content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto sidebar">
                <a href="index.html" class="d-flex align-items-center mb-4 text-decoration-none text-white" data-aos="fade-right">
                    <i class="bi bi-droplet fs-1"></i>
                    <span class="fs-4 ms-2">Sensorium</span>
                </a>
                <nav class="nav flex-column w-100" data-aos="fade-right" data-aos-delay="100">
                    <a class="nav-link active" href="#painel" onclick="showSection(event, 'painel')">
                        <i class="bi bi-speedometer2"></i>
                        <span>Painel</span>
                    </a>
                    <a class="nav-link" href="#usuarios" onclick="showSection(event, 'usuarios')">
                        <i class="bi bi-people"></i>
                        <span>Usuários</span>
                    </a>
                    <a class="nav-link" href="#notificacoes" onclick="showSection(event, 'notificacoes')">
                        <i class="bi bi-bell"></i>
                        <span>Notificações</span>
                    </a>
                    <a class="nav-link" href="#configuracoes" onclick="showSection(event, 'configuracoes')">
                        <i class="bi bi-gear"></i>
                        <span>Configurações</span>
                    </a>
                </nav>
                <a href="#" id="logout-button" class="logout-link mt-auto" data-aos="fade-right" data-aos-delay="200">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair</span>
                </a>
            </div>
            
            <main class="col content">
                <div id="alert-container"></div>
                <header class="d-flex justify-content-between align-items-center mb-4" data-aos="fade-up">
                    <h2 class="mb-0 text-primary">
                        <i class="bi bi-person-workspace me-2"></i>
                        Bem-vindo, Administrador!
                    </h2>
                    <button class="btn btn-outline-primary" onclick="loadDashboardData()">
                        <i class="bi bi-arrow-clockwise me-2"></i>Atualizar
                    </button>
                </header>

                <!-- Painel Section -->
                <section id="painel" class="section-panel active">
                    <div class="row">
                        <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                            <div class="dashboard-card text-center">
                                <div class="dashboard-icon"><i class="bi bi-people"></i></div>
                                <h5 class="mb-1">Total de Usuários</h5>
                                <p class="mb-0 fs-4 fw-bold text-primary" id="total-usuarios">...</p>
                            </div>
                        </div>
                        <div class="col-md-4" data-aos="fade-up" data-aos-delay="200">
                            <div class="dashboard-card text-center">
                                <div class="dashboard-icon"><i class="bi bi-moisture"></i></div>
                                <h5 class="mb-1">Locais Monitorados</h5>
                                <p class="mb-0 fs-4 fw-bold text-primary" id="total-locais">...</p>
                            </div>
                        </div>
                        <div class="col-md-4" data-aos="fade-up" data-aos-delay="300">
                            <div class="dashboard-card text-center">
                                <div class="dashboard-icon"><i class="bi bi-bell"></i></div>
                                <h5 class="mb-1">Notificações (Admin)</h5>
                                <p class="mb-0 fs-4 fw-bold text-primary" id="total-notificacoes">...</p>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- Usuários Section -->
                <section id="usuarios" class="section-panel mt-5" data-aos="fade-up">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-people-fill fs-3 text-primary me-2"></i>
                        <h4 class="mb-0">Usuários</h4>
                    </div>
                    <div class="dashboard-card">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nome</th><th>CPF</th><th>Email</th><th>Endereço</th><th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="usuarios-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Notificações Section -->
                <section id="notificacoes" class="section-panel mt-5" data-aos="fade-up">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-bell-fill fs-3 text-primary me-2"></i>
                        <h4 class="mb-0">Notificações do Sistema</h4>
                    </div>
                    <div class="dashboard-card">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Mensagem</th><th>Data</th><th>Status</th><th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="notificacoes-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Configurações Section -->
                <section id="configuracoes" class="section-panel mt-5" data-aos="fade-up">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-gear-fill fs-3 text-primary me-2"></i>
                        <h4 class="mb-0">Configurações do Sistema</h4>
                    </div>
                    <div class="dashboard-card">
                        <form id="configuracoes-form"></form>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // --- CONTROLE DE NAVEGAÇÃO ---
        function showSection(event, sectionId) {
            if(event) event.preventDefault();
            document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar .nav-link[href="#${sectionId}"]`);
            if(activeLink) activeLink.classList.add('active');
            
            document.querySelectorAll('.section-panel').forEach(panel => {
                panel.style.display = 'none';
                panel.classList.remove('active');
            });
            const section = document.getElementById(sectionId);
            section.style.display = 'block';
            section.classList.add('active');
            
            history.pushState({}, '', `#${sectionId}`);
        }

        function handleHashChange() {
            const hash = window.location.hash.slice(1) || 'painel';
            showSection(null, hash);
        }
        window.addEventListener('hashchange', handleHashChange);

        // --- LÓGICA PRINCIPAL ---
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 800, once: true });
            
            const token = localStorage.getItem('adminAccessToken');
            if (!token) {
                window.location.href = 'login_admin.html';
                return;
            }
            
            loadDashboardData();
            handleHashChange();
            setupEventListeners();
        });

        async function loadDashboardData() {
            const token = localStorage.getItem('adminAccessToken');
            const headers = { 'Authorization': `Bearer ${token}` };

            try {
                const response = await fetch('/api/v1/admin/dashboard', { headers });
                if (response.status === 401) {
                    localStorage.removeItem('adminAccessToken');
                    window.location.href = 'login_admin.html';
                    return;
                }
                if (!response.ok) throw new Error('Falha ao carregar dados do dashboard');
                
                const data = await response.json();
                
                // Painel
                document.getElementById('total-usuarios').textContent = data.total_usuarios;
                document.getElementById('total-locais').textContent = data.total_locais;
                document.getElementById('total-notificacoes').textContent = data.notificacoes_nao_lidas;

                // Tabela de Usuários
                const usuariosBody = document.getElementById('usuarios-table-body');
                if (data.usuarios.length > 0) {
                    usuariosBody.innerHTML = data.usuarios.map(u => `
                        <tr>
                            <td>${u.nome}</td><td>${u.cpf}</td><td>${u.email}</td><td>${u.endereco}</td>
                            <td><button class="btn btn-sm btn-primary" onclick="viewUser('${u.id}')"><i class="bi bi-eye"></i></button></td>
                        </tr>
                    `).join('');
                } else {
                    usuariosBody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum usuário encontrado.</td></tr>';
                }

                // Tabela de Notificações
                const notificacoesBody = document.getElementById('notificacoes-table-body');
                if (data.notificacoes.length > 0) {
                    notificacoesBody.innerHTML = data.notificacoes.map(n => `
                        <tr class="${n.lida ? '' : 'table-warning'}">
                            <td>${n.mensagem}</td><td>${new Date(n.data_criacao).toLocaleString('pt-BR')}</td>
                            <td><span class="badge bg-${n.lida ? 'success' : 'warning'}">${n.lida ? 'Lida' : 'Não Lida'}</span></td>
                            <td>${!n.lida ? `<button class="btn btn-sm btn-success" onclick="markNotificationAsRead('${n.id}')"><i class="bi bi-check-lg"></i></button>` : ''}</td>
                        </tr>
                    `).join('');
                } else {
                    notificacoesBody.innerHTML = '<tr><td colspan="4" class="text-center">Nenhuma notificação encontrada.</td></tr>';
                }

            } catch (error) {
                console.error('Erro:', error);
                displayAlert('Não foi possível carregar os dados do painel.', 'danger');
            }
        }

        function setupEventListeners() {
            document.getElementById('logout-button').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('adminAccessToken');
                window.location.href = 'login_admin.html';
            });
        }

        function displayAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const alert = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            container.innerHTML = alert;
        }
        
        // Funções de ação (stubs, precisam de modais e lógica de API)
        function viewUser(id) {
            // TODO: Implementar modal para ver detalhes do usuário
            displayAlert(`Visualizar usuário com ID: ${id}`, 'info');
        }

        async function markNotificationAsRead(id) {
            const token = localStorage.getItem('adminAccessToken');
            try {
                const response = await fetch(`/api/v1/notificacoes/admin/${id}/marcar-como-lida`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Falha ao marcar notificação como lida');
                displayAlert('Notificação marcada como lida.', 'success');
                loadDashboardData(); // Recarrega os dados
            } catch (error) {
                console.error('Erro:', error);
                displayAlert(error.message, 'danger');
            }
        }
    </script>
</body>
</html>
