<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sensorium{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='img/project.PNG') }}">
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    
    <!-- Global theme defaults -->
    <style>
        :root {
            --primary-blue: #004183;
            --accent-color: #00E0C6;
            --light-bg: #f8faff;
        }

        /* Navbar colors in dark mode (default sane values) */
        body.dark-mode .navbar {
            background-color: rgba(18,18,18,0.95) !important;
        }
        body.dark-mode .navbar .nav-link,
        body.dark-mode .navbar .navbar-brand,
        body.dark-mode .navbar .navbar-brand i {
            color: rgba(255,255,255,0.85);
        }
        body.dark-mode .navbar .nav-link:hover,
        body.dark-mode .navbar .navbar-brand:hover,
        body.dark-mode .navbar .navbar-brand:hover i {
            color: var(--accent-color);
        }
    </style>

    <!-- CSS Específico da Página -->
    {% block styles %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script> <!-- Script do Tema -->
    <script>
        AOS.init({ duration: 1000, once: true, offset: 100 });
    </script>
    
    <!-- Scripts Específicos da Página -->
    {% block scripts %}{% endblock %}
</body>
</html>
