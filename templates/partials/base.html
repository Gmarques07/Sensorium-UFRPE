<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sensorium{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='img/mini_logo_sensorium0.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='img/logo.png') }}">
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    
    <!-- Global theme defaults -->
    <style>
        :root {
            --primary-blue: #004183;
            --accent-color: #00E0C6;
            --light-bg: #f8faff;
        }

        /* Navbar colors in dark mode (default sane values) */
        body.dark-mode .navbar {
            background-color: rgba(18,18,18,0.95) !important;
        }
        body.dark-mode .navbar .nav-link,
        body.dark-mode .navbar .navbar-brand,
        body.dark-mode .navbar .navbar-brand i {
            color: rgba(255,255,255,0.85);
        }
        body.dark-mode .navbar .nav-link:hover,
        body.dark-mode .navbar .navbar-brand:hover,
        body.dark-mode .navbar .navbar-brand:hover i {
            color: var(--accent-color);
        }
    </style>

    <!-- CSS Específico da Página -->
    {% block styles %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;" id="toastContainer"></div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;" id="toastContainer"></div>

    <!-- Alerta Flash Central (Substitui o Modal de Alerta) -->
    <div id="alertaFlashCentral" class="position-fixed start-50 translate-middle-x top-0 mt-5 shadow-lg p-3 rounded-4 bg-white border-start border-5 border-danger d-none d-flex align-items-center gap-3" style="z-index: 10060; min-width: 320px; max-width: 90%; transition: all 0.3s ease;">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-3"></i>
        <div class="flex-grow-1">
            <div class="fw-bold text-danger mb-0" id="alertaFlashTitulo">Atenção</div>
            <div class="text-secondary small" id="alertaFlashMensagem">Mensagem...</div>
        </div>
        <button type="button" class="btn-close" onclick="document.getElementById('alertaFlashCentral').classList.add('d-none')"></button>
    </div>

    <!-- Modal Global de Confirmação -->
    <div class="modal fade" id="modalConfirmacaoGlobal" tabindex="-1" aria-hidden="true" style="z-index: 10050;">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body text-center pb-3">
                    <div class="mb-2">
                        <i class="bi bi-question-circle text-warning fs-1"></i>
                    </div>
                    <h5 class="fw-bold mb-2 text-dark" id="modalConfirmacaoTitulo">Confirmação</h5>
                    <p class="text-muted small px-2 mb-0" id="modalConfirmacaoMensagem">Tem certeza?</p>
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" data-bs-dismiss="modal">Não</button>
                        <button type="button" class="btn btn-danger btn-sm rounded-pill px-3" id="btnConfirmacaoSim">Sim</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script> <!-- Script do Tema -->
    <script>
        AOS.init({ duration: 1000, once: true, offset: 100 });

        // Função Global de Notificação (Toast)
        function mostrarNotificacao(mensagem, tipo = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            // Mapeamento de cores/ícones
            const tipos = {
                'success': { icon: 'bi-check-circle-fill', color: 'text-success', border: 'border-success' },
                'danger': { icon: 'bi-exclamation-triangle-fill', color: 'text-danger', border: 'border-danger' },
                'warning': { icon: 'bi-exclamation-circle-fill', color: 'text-warning', border: 'border-warning' },
                'info': { icon: 'bi-info-circle-fill', color: 'text-primary', border: 'border-primary' }
            };

            const config = tipos[tipo] || tipos['info'];
            const id = 'toast-' + Date.now();

            const html = `
                <div id="${id}" class="toast align-items-center border-0 shadow-lg mb-2" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex border-start border-5 ${config.border}">
                        <div class="toast-body d-flex align-items-center gap-2">
                            <i class="bi ${config.icon} fs-5 ${config.color}"></i>
                            <div class="fw-medium">${mensagem}</div>
                        </div>
                        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', html);
            const toastEl = document.getElementById(id);
            const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
            
            toast.show();

            toastEl.addEventListener('hidden.bs.toast', () => {
                toastEl.remove();
            });
        }

        // Função Global de Alerta (Flash Central) - Substitui o Modal
        let flashTimeout;
        function mostrarAlertaModal(mensagem, titulo = 'Aviso', tipo = 'info') {
            const alerta = document.getElementById('alertaFlashCentral');
            const icone = alerta.querySelector('i');
            const tituloEl = document.getElementById('alertaFlashTitulo');
            
            if (!alerta) return;
            
            // Configuração de Estilos
            const estilos = {
                'success': { border: 'border-success', text: 'text-success', icon: 'bi-check-circle-fill' },
                'danger': { border: 'border-danger', text: 'text-danger', icon: 'bi-exclamation-triangle-fill' },
                'error': { border: 'border-danger', text: 'text-danger', icon: 'bi-exclamation-triangle-fill' }, // Alias
                'warning': { border: 'border-warning', text: 'text-warning', icon: 'bi-exclamation-circle-fill' },
                'info': { border: 'border-primary', text: 'text-primary', icon: 'bi-info-circle-fill' }
            };

            const estilo = estilos[tipo] || estilos['info'];

            // Limpar classes anteriores
            alerta.className = alerta.className.replace(/border-(success|danger|warning|primary)/g, '');
            icone.className = icone.className.replace(/text-(success|danger|warning|primary)|bi-[\w-]+/g, '');
            tituloEl.className = tituloEl.className.replace(/text-(success|danger|warning|primary)/g, '');

            // Aplicar novos estilos
            alerta.classList.add(estilo.border);
            icone.classList.add(estilo.icon, estilo.text, 'bi', 'fs-3');
            tituloEl.classList.add(estilo.text, 'fw-bold', 'mb-0');
            
            // Conteúdo
            document.getElementById('alertaFlashMensagem').textContent = mensagem;
            tituloEl.textContent = titulo;
            
            // Mostrar
            alerta.classList.remove('d-none');
            
            if (flashTimeout) clearTimeout(flashTimeout);
            flashTimeout = setTimeout(() => {
                alerta.classList.add('d-none');
            }, 4000); 
        }

        // Função Global de Confirmação (Modal)
        let acaoConfirmacaoAtual = null;

        function confirmarAcao(titulo, mensagem, callback) {
            const modalEl = document.getElementById('modalConfirmacaoGlobal');
            if (!modalEl) {
                if (confirm(mensagem)) callback();
                return;
            }
            
            document.getElementById('modalConfirmacaoTitulo').textContent = titulo;
            document.getElementById('modalConfirmacaoMensagem').textContent = mensagem;
            
            acaoConfirmacaoAtual = callback;
            
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnSim = document.getElementById('btnConfirmacaoSim');
            if (btnSim) {
                btnSim.addEventListener('click', () => {
                    if (acaoConfirmacaoAtual) acaoConfirmacaoAtual();
                    const modalEl = document.getElementById('modalConfirmacaoGlobal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                });
            }
        });
    </script>
    
    <!-- Scripts Específicos da Página -->
    {% block scripts %}{% endblock %}
</body>
</html>
