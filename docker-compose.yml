version: '3.8'

services:
  sensorium-backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=banco_de_dados
      - SECRET_KEY=chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BASE_URL=http://localhost:8002
      - ENVIRONMENT=production
    volumes:
      - .:/app  # Para desenvolvimento, sincroniza o código
      - ./static:/app/static  # Monta o diretório static
      - ./templates:/app/templates  # Monta o diretório templates

# Removendo o serviço mysql pois estamos usando o MySQL local do WAMP