services:
  tests:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sensorium_tests
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: '["*"]'
      PYTHONPATH: "/app"
    volumes:
      - .:/app
      - ./templates:/app/templates
      - ./static:/app/static
    command: pytest backend/tests/ --ignore=backend/tests/integration -q

  backend_int:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sensorium_backend_int
    command: ["sh", "-c", "PYTHONPATH=/app python backend/scripts/init_db.py && PYTHONPATH=/app uvicorn backend.app.main:app --host 0.0.0.0 --port 8003"]
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: banco_de_dados
      MYSQL_PORT: 3306
      SECRET_KEY: "chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: '["*"]'
      PYTHONPATH: "/app"
      DISABLE_RATE_LIMITING: "true"
    volumes:
      - .:/app
      - ./templates:/app/templates
      - ./static:/app/static
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  tests_integration:
    build: 
      context: .
      dockerfile: Dockerfile.tests
    container_name: sensorium_tests_integration
    depends_on:
      backend_int:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://backend_int:8003"
      SECRET_KEY: "chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui"
      DISABLE_RATE_LIMITING: "true"
      PYTHONPATH: "/app"
      MYSQL_HOST: host.docker.internal
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: banco_de_dados
      MYSQL_PORT: 3306
    volumes:
      - .:/app
      - ./templates:/app/templates
      - ./static:/app/static
    command: pytest -q backend/tests/integration -s

  coverage:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: sensorium_coverage
    depends_on:
      backend_int:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://backend_int:8003"
      SECRET_KEY: "chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui"
      DISABLE_RATE_LIMITING: "true"
      PYTHONPATH: "/app"
      MYSQL_HOST: host.docker.internal
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: banco_de_dados
      MYSQL_PORT: 3306
    volumes:
      - .:/app
    command: pytest --cov=backend/app --cov-report=term-missing backend/tests/