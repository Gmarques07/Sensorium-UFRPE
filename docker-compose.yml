services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensorium_app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: sensorium_db
      MYSQL_PORT: 3306
      DATABASE_URL: "mysql+mysqlconnector://root:rootpassword@mysql:3306/sensorium_db?charset=utf8mb4"
      SECRET_KEY: "chave_secreta_muito_longa_e_segura_para_jwt_tokens_aqui"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: '["*"]'
      PYTHONPATH: "/app"
      DISABLE_RATE_LIMITING: "true"
      API_BASE_URL: "http://localhost:8003"
    volumes:
      - .:/app
      - ./templates:/app/templates
      - ./static:/app/static
    ports:
      - "8001:8001"
    command: >
      sh -c "
        set -e
        echo 'Inicializando banco de dados...'
        python backend/scripts/init_db.py
        echo 'Rodando testes de unidade e integração com banco de dados isolado...'
        ENVIRONMENT=test pytest backend/tests/ --ignore-glob='backend/tests/integration/test_*_e2e.py' -v
        echo 'Iniciando aplicação para os testes E2E...'
        timeout 180s uvicorn backend.app.main:app --host 0.0.0.0 --port 8003 --log-level info &
        APP_PID=$!
        sleep 15
        echo 'Aguardando a aplicação ficar pronta...'
        until curl -f http://localhost:8003/health > /dev/null 2>&1; do echo 'Aguardando o backend...'; sleep 5; done
        echo 'Aguardando mais 10 segundos para garantir que o servidor esteja completamente inicializado...'
        sleep 10
        echo 'Rodando testes E2E (end-to-end)...'
        ENVIRONMENT=test API_BASE_URL=http://localhost:8003 pytest backend/tests/integration/test_*_e2e.py
        echo 'Rodando testes de cobertura...'
        ENVIRONMENT=test pytest --cov=backend/app --cov-report=term-missing backend/tests/
        echo 'Parando a aplicação após os testes E2E...'
        kill -TERM $APP_PID 2>/dev/null || true
        sleep 2
        echo 'Testes concluídos com sucesso. Iniciando aplicação...'
        uvicorn backend.app.main:app --host 0.0.0.0 --port 8001
      "

  mysql:
    image: mysql:8.0
    container_name: sensorium_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sensorium_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
